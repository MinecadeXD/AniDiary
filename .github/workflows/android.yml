name: Build AniDiary APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Install Capacitor Assets
        run: npm install --no-save @capacitor/assets

      - name: Generate launcher icons
        run: npx capacitor-assets generate

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set AniDiary version
        run: |
          sed -i 's/versionCode .*/versionCode 10401/' android/app/build.gradle
          sed -i 's/versionName .*/versionName "1.4.1"/' android/app/build.gradle

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build AniDiary APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AniDiary.apk

      - name: Upload AniDiary APK
        uses: actions/upload-artifact@v4
        with:
          name: AniDiary-1.4.1
          path: AniDiary.apk
