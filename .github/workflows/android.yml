name: Build AniDiary APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Install Capacitor Assets
        run: npm install --no-save @capacitor/assets

      - name: Generate launcher icons
        run: npx capacitor-assets generate

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set AniDiary version
        run: |
          sed -i 's/versionCode .*/versionCode 10402/' android/app/build.gradle
          sed -i 's/versionName .*/versionName "1.4.2"/' android/app/build.gradle

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/AniDiary-release.jks
          test -s android/app/AniDiary-release.jks

      - name: Configure release signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          {
            echo "ANIDIARY_KEYSTORE_FILE=app/AniDiary-release.jks"
            echo "ANIDIARY_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANIDIARY_KEY_ALIAS=$KEY_ALIAS"
            echo "ANIDIARY_KEY_PASSWORD=$KEY_PASSWORD"
          } >> android/gradle.properties

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build AniDiary release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk AniDiary-1.4.2-release.apk

      - name: Remove signing keystore
        if: always()
        run: rm -f android/app/AniDiary-release.jks

      - name: Upload AniDiary release APK
        uses: actions/upload-artifact@v4
        with:
          name: AniDiary-1.4.2-release
          path: AniDiary-1.4.2-release.apk
